name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================
  # Backend Tests & Build
  # ============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend linter
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Run backend tests
        working-directory: ./backend
        run: npm test --if-present
        env:
          JWT_SECRET: test-secret-key-for-ci-pipeline-minimum-64-characters-long
          NODE_ENV: test

      - name: Build backend Docker image
        working-directory: ./backend
        run: docker build -t hbtrade-backend:test .

  # ============================================
  # Frontend Tests & Build
  # ============================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Build frontend Docker image
        working-directory: ./frontend
        run: docker build -t hbtrade-frontend:test .

  # ============================================
  # Security Scan
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ============================================
  # Deploy to Render (on main branch only)
  # ============================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          echo "Deployment triggered on Render via Blueprint"
          echo "Render will automatically deploy when changes are pushed to main branch"
          echo "Monitor deployment at: https://dashboard.render.com"

      - name: Deployment Info
        run: |
          echo "============================================"
          echo "Deployment Summary:"
          echo "- Frontend: https://hbtrade-frontend.onrender.com"
          echo "- Backend: https://hbtrade-backend.onrender.com"
          echo "- Database: hbtrade-db (private)"
          echo "============================================"
          echo ""
          echo "Post-deployment steps:"
          echo "1. Initialize database with database/schema.sql"
          echo "2. Create admin user"
          echo "3. Verify all services are running"
