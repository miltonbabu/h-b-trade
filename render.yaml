# Render Blueprint for H&B Trade Platform
# Backend on Render + Frontend on Vercel + Database on Supabase
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ============================================
  # Backend API Service (connected to Supabase)
  # ============================================
  - type: web
    name: hbtrade-backend
    env: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Supabase Database Connection
      - key: DATABASE_URL
        sync: false # Set manually: postgresql://postgres.REF:PASSWORD@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
      - key: DB_HOST
        sync: false # e.g. aws-1-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false # e.g. postgres.YOUR_PROJECT_REF
      - key: DB_PASSWORD
        sync: false # Your Supabase DB password
      - key: DB_SSL
        value: "true"
      # Supabase (optional direct access)
      - key: SUPABASE_URL
        sync: false # https://YOUR_PROJECT_REF.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Authentication
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # CORS & Frontend (Vercel)
      - key: FRONTEND_URL
        value: https://h-b-trade.vercel.app
      # File Upload
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      # Logging
      - key: LOG_LEVEL
        value: info

# ============================================
# SETUP NOTES:
# ============================================
# 1. After creating the service, set these secrets in Render Dashboard:
#    - DATABASE_URL: Your Supabase PostgreSQL connection string
#    - DB_HOST, DB_USER, DB_PASSWORD: Individual Supabase DB params
#    - SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY (optional)
#
# 2. Frontend is deployed on Vercel (see vercel.json)
#    - Set NEXT_PUBLIC_API_URL in Vercel: https://hbtrade-backend.onrender.com/api
#
# 3. Supabase Database:
#    - Run database/supabase-schema.sql in Supabase SQL Editor
#    - Default admin: admin@hbtrade.com / HbTrade@2024!
#
# 4. Free Tier Limitations:
#    - Render free tier spins down after 15 min inactivity
#    - Cold start takes 30-60 seconds
#    - 750 hours/month free per service
# ============================================
